<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamingTech Pitamber</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background-color: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 10px;
        }
        p.welcome-text {
            text-align: center;
            color: #cccccc;
            font-size: 18px;
            margin-bottom: 20px;
        }

        /* 🔍 नयाँ Search Bar को डिजाइन */
        .search-container {
            margin-bottom: 25px;
            text-align: center;
        }
        #searchInput {
            width: 90%;
            max-width: 500px;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #555;
            background-color: #1a1a1a;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        #searchInput::placeholder {
            color: #888;
        }
        #searchInput:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.5);
        }

        /* Accordion (Drop-down) को डिजाइन */
        .category-section {
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 8px;
            overflow: hidden;
        }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #3a3a3a;
            padding: 15px 20px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .category-header:hover {
            background-color: #4CAF50; /* माउस लग्दा हरियो हुने */
        }
        .category-header h2 {
            margin: 0;
            color: #f39c12; /* सुनौलो रङ */
            font-size: 20px;
        }
        
        /* एरो (Arrow) को डिजाइन */
        .arrow {
            font-size: 18px;
            color: #ffffff;
            transition: transform 0.3s ease;
        }
        .arrow.open {
            transform: rotate(180deg); /* क्लिक गर्दा एरो घुम्ने */
        }

        /* क्याटेगरी भित्रको कन्टेन्ट */
        .category-body {
            display: none;
            background-color: #2d2d2d;
            padding: 0 15px;
        }
        .category-body.active {
            display: block;
            padding: 15px;
        }
        
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            background: #3a3a3a;
            margin: 10px 0;
            padding: 15px;
            border-radius: 5px;
            transition: 0.3s;
            border-left: 4px solid #4CAF50;
        }
        li:hover {
            background: #444;
        }
        a {
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            display: block;
        }
        .post-category-label {
            font-size: 12px;
            color: #bdc3c7;
            margin-bottom: 5px;
            display: block;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* सर्च नतिजा नभेटिएको खण्डमा */
        #noResults {
            display: none;
            text-align: center;
            color: #e74c3c;
            font-size: 16px;
            margin-top: 20px;
            padding: 15px;
            background: #2d2d2d;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 GamingTech Pitamber</h1>
        <p class="welcome-text">Welcome to my Tech, Gaming, and App knowledge base!</p>

        <!-- 🔍 Search Bar यहाँ थपिएको छ -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="🔍 पोस्ट खोज्नुहोस्... (जस्तै: Gmail, Snake, Fiber)">
        </div>

        <!-- १. Gaming क्याटेगरी -->
        <div class="category-section">
            <div class="category-header" onclick="toggleAccordion('gaming')">
                <h2>🎮 Gaming (गेमिङ)</h2>
                <span class="arrow" id="arrow-gaming">▼</span>
            </div>
            <div class="category-body" id="body-gaming">
                <ul id="list-gaming"></ul>
            </div>
        </div>

        <!-- २. App क्याटेगरी -->
        <div class="category-section">
            <div class="category-header" onclick="toggleAccordion('app')">
                <h2>📱 App (एपहरू)</h2>
                <span class="arrow" id="arrow-app">▼</span>
            </div>
            <div class="category-body" id="body-app">
                <ul id="list-app"></ul>
            </div>
        </div>

        <!-- ३. Tech क्याटेगरी -->
        <div class="category-section">
            <div class="category-header" onclick="toggleAccordion('tech')">
                <h2>💻 Tech (टेक्नोलोजी)</h2>
                <span class="arrow" id="arrow-tech">▼</span>
            </div>
            <div class="category-body" id="body-tech">
                <ul id="list-tech"></ul>
            </div>
        </div>

        <!-- सर्च गर्दा केही नभेटिए यो देखिन्छ -->
        <div id="noResults">❌ खोजिएको पोस्ट भेटिएन। कृपया अरू शब्द टाइप गर्नुहोस्।</div>

    </div>

    <!-- ===================== JAVASCRIPT ===================== -->
    <script>
        // १. यहाँ तपाईंका सबै पोस्टहरूको डेटा राख्नुहोस्
        const allPosts = [
            // Gaming पोस्टहरू
            { category: "gaming", title: "Dot Snake Game - खेल्नुहोस् र डाउनलोड गर्नुहोस्", file: "dot-snake-game.html" },
            { category: "gaming", title: "Block Blast Fall - खेल्नुहोस् र डाउनलोड गर्नुहोस्", file: "block-blast-fall-game.html" },
            
            // Tech पोस्टहरू
            { category: "tech", title: "नेपाल टेलिकमको फाइबर इन्टरनेट कसरी जडान गर्ने?", file: "nepal-telecom-fibernet-installation-guide.html" },
            { category: "tech", title: "नयाँ Gmail खाता कसरी बनाउने?", file: "gmail-account-create.html" },
            { category: "tech", title: "नयाँ gettyimage खाता बनाउने तरिका मोबाइल बाट?", file: "gettyimage-account-create.html" },
            
            // App पोस्टहरू
            { category: "app", title: "नयाँ एपको जानकारी चाँडै आउँदैछ...", file: "#" }
        ];

        // २. पोस्टहरूलाई वेबसाइटमा देखाउने फंक्शन (डेटा पास गर्न मिल्ने)
        function renderPosts(dataToRender) {
            // सुरुमा सबै लिस्ट खाली गर्ने
            document.querySelectorAll('ul[id^="list-"]').forEach(list => list.innerHTML = '');

            // डेटा अनुसार लिस्ट भर्ने
            dataToRender.forEach(post => {
                const list = document.getElementById(`list-${post.category}`);
                if (list) {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span class="post-category-label">${post.category}</span>
                        <a href="${post.file}">${post.title}</a>
                    `;
                    list.appendChild(li);
                }
            });
        }

        // ३. क्याटेगरी खोल्ने र बन्द गर्ने फंक्शन (Accordion Logic)
        function toggleAccordion(categoryId) {
            const targetBody = document.getElementById(`body-${categoryId}`);
            const targetArrow = document.getElementById(`arrow-${categoryId}`);
            
            const isOpen = targetBody.classList.contains('active');

            // पहिले सबै क्याटेगरी बन्द गर्ने
            document.querySelectorAll('.category-body').forEach(body => body.classList.remove('active'));
            document.querySelectorAll('.arrow').forEach(arrow => arrow.classList.remove('open'));

            // यदि पहिले खुला थिएन भने मात्र खोल्ने
            if (!isOpen) {
                targetBody.classList.add('active');
                targetArrow.classList.add('open');
            }
        }

        // ४. पेज लोड हुँदा र सर्च गर्दा हुने काम
        document.addEventListener("DOMContentLoaded", () => {
            // सुरुमा सबै पोस्ट देखाउने
            renderPosts(allPosts);

            const searchInput = document.getElementById('searchInput');
            const noResults = document.getElementById('noResults');

            // 🔍 सर्च बक्समा टाइप गर्दा हुने काम
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                
                // सर्चसँग मिल्ने पोस्ट छान्ने
                const filteredPosts = allPosts.filter(post => 
                    post.title.toLowerCase().includes(query) || 
                    post.category.toLowerCase().includes(query) ||
                    post.file.toLowerCase().includes(query)
                );

                // छानिएका पोस्ट देखाउने
                renderPosts(filteredPosts);

                // यदि सर्चमा केही लेखिएको छ भने
                if (query !== '') {
                    let hasVisibleResults = false;

                    // सबै क्याटेगरी चेक गर्ने
                    ['gaming', 'app', 'tech'].forEach(cat => {
                        const list = document.getElementById(`list-${cat}`);
                        const body = document.getElementById(`body-${cat}`);
                        const arrow = document.getElementById(`arrow-${cat}`);

                        // यदि त्यो क्याटेगरीमा सर्चसँग मिल्ने पोस्ट छ भने खोल्ने, छैन भने बन्द राख्ने
                        if (list.children.length > 0) {
                            body.classList.add('active');
                            arrow.classList.add('open');
                            hasVisibleResults = true;
                        } else {
                            body.classList.remove('active');
                            arrow.classList.remove('open');
                        }
                    });

                    // यदि कुनै पनि पोस्ट भेटिएन भने म्यासेज देखाउने
                    if (hasVisibleResults) {
                        noResults.style.display = 'none';
                    } else {
                        noResults.style.display = 'block';
                    }

                } else {
                    // यदि सर्च बक्स खाली भयो भने सबै क्याटेगरी बन्द गर्ने
                    document.querySelectorAll('.category-body').forEach(body => body.classList.remove('active'));
                    document.querySelectorAll('.arrow').forEach(arrow => arrow.classList.remove('open'));
                    noResults.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
